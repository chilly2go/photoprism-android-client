name: Own release

# Builds the clone APK, which installs next to the official app,
# and publishes it as a GitHub release for Obtainium.
# Triggered by pushing a tag like v1.47.1-own.1

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history with tags, to list the commits since the previous release.
          fetch-depth: 0

      - name: Create the signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "The SIGNING_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/ci-signing.jks

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build the clone APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          # Must grow with each release for Android to accept the update.
          VERSION_CODE=$((73000 + GITHUB_RUN_NUMBER))
          ./gradlew app:assembleReleaseClone --stacktrace \
            -PownVersionName="$VERSION_NAME" \
            -PownVersionCode="$VERSION_CODE"

      - name: Write the release notes
        run: |
          NOTES_FILE="release-notes/$GITHUB_REF_NAME.md"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*-own.*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            if [ -f "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
              echo
            fi
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "### Changes since $PREVIOUS_TAG"
              echo
              git log --no-merges --format='- %s' "$PREVIOUS_TAG..$GITHUB_REF_NAME" -- . ':!release-notes'
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            app/build/outputs/apk/releaseClone/*.apk
