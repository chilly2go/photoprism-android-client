name: Own release

# Builds the clone APK, which installs next to the official app,
# and publishes it as a GitHub release for Obtainium.
# Triggered by pushing a tag like v1.47.1-own.1

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "The SIGNING_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/ci-signing.jks

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build the clone APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          # Must grow with each release for Android to accept the update.
          VERSION_CODE=$((73000 + GITHUB_RUN_NUMBER))
          ./gradlew app:assembleReleaseClone --stacktrace \
            -PownVersionName="$VERSION_NAME" \
            -PownVersionCode="$VERSION_CODE"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Own build with the upload queue and the media picker." \
            app/build/outputs/apk/releaseClone/*.apk
