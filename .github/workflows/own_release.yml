name: Own release

# Builds the clone APK, which installs next to the official app,
# and publishes it as a GitHub release for Obtainium.
# Triggered by pushing a tag like v1.47.1-own.1

on:
  push:
    tags:
      - "v*-own.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history with tags, to list the commits since the previous release.
          fetch-depth: 0

      - name: Create the signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "The SIGNING_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/ci-signing.jks

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build the clone APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          # Must grow with each release for Android to accept the update,
          # so it comes from the tag, not from the run number,
          # which starts over if the workflow is recreated:
          # upstream version code * 1000 + 100 + N of "-own.N".
          # The 100 keeps it above the codes of the first releases (73000 + run number).
          OWN_NUMBER="${GITHUB_REF_NAME##*-own.}"
          UPSTREAM_CODE=$(sed -n 's/^ *versionCode \([0-9][0-9]*\)$/\1/p' app/build.gradle | head -n 1)
          case "$OWN_NUMBER" in
            ''|*[!0-9]*)
              echo "The tag $GITHUB_REF_NAME doesn't end with -own.<number>" >&2
              exit 1
              ;;
          esac
          if [ -z "$UPSTREAM_CODE" ] || [ "$OWN_NUMBER" -ge 900 ]; then
            echo "Can't derive the version code: upstream=$UPSTREAM_CODE own=$OWN_NUMBER" >&2
            exit 1
          fi
          VERSION_CODE=$((UPSTREAM_CODE * 1000 + 100 + OWN_NUMBER))
          echo "Version $VERSION_NAME ($VERSION_CODE)"
          ./gradlew app:assembleReleaseClone --stacktrace \
            -PownVersionName="$VERSION_NAME" \
            -PownVersionCode="$VERSION_CODE"

      - name: Write the release notes
        run: |
          NOTES_FILE="release-notes/$GITHUB_REF_NAME.md"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*-own.*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            if [ -f "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
              echo
            fi
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "### Changes since $PREVIOUS_TAG"
              echo
              git log --no-merges --format='- %s' "$PREVIOUS_TAG..$GITHUB_REF_NAME" -- . ':!release-notes'
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run after a partly failed run finds the release already there.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" --clobber \
              app/build/outputs/apk/releaseClone/*.apk
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              app/build/outputs/apk/releaseClone/*.apk
          fi
